[workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
platforms = ["win-64", "linux-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
smcnn-core = { path = "../../smcnn/core" }
hello = { path = "." }
python = "<=3.12"

[pypi-dependencies]
genstudio = ">=2025.2.2, <2026"
genjax = ">=0.9.2, <0.10"

[package]
name = "hello"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "0.1.*" }

[package.host-dependencies]
hatchling = "==1.26.3"
python = "<=3.12"

[package.run-dependencies]
