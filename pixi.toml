# --8<-- [start:workspace]
[workspace]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
platforms = ["win-64", "linux-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
genbrain_smcnn_core = { path = "packages/smcnn/core" }
genbrain_smcnn_bioreal = { path = "packages/smcnn/bioreal" }
genbrain_utils_genjax = { path = "packages/utils/genjax" }
genbrain_model_3dot = { path = "packages/models/perception/3dot" }
genbrain = { path = "." }
# --8<-- [end:workspace]

[tasks]

[package]
name = "genbrain"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-python", version = "0.1.*" }

[package.host-dependencies]
hatchling = "==1.26.3"
python = "<=3.12"

[package.run-dependencies]
